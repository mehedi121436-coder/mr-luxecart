<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="MR LuxeCart premium online shop"><title>MR LuxeCart</title><style>*{box-sizing:border-box}body{margin:0;background:#080809;color:#f5f2ea;font-family:Inter,Arial,sans-serif}header{height:70px;padding:0 6%;display:flex;align-items:center;gap:12px;border-bottom:1px solid #27272a;position:sticky;top:0;background:#080809ee;backdrop-filter:blur(12px);z-index:10}.logo{color:#d8b25b;border:1px solid #d8b25b;padding:9px;border-radius:9px;font-weight:900}.brand{font-weight:900}nav{margin-left:auto;display:flex;gap:18px}a{color:inherit;text-decoration:none}.hero{padding:90px 8%;background:radial-gradient(circle at 80%,#2b2418,#080809 48%)}h1{font-size:clamp(48px,8vw,84px);line-height:.95;margin:12px 0}.gold{color:#d8b25b}.section{padding:55px 8%;border-top:1px solid #222}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:17px}.card{background:#131315;border:1px solid #29292d;border-radius:14px;padding:14px}.pic{height:210px;border-radius:10px;background:#1e1e21;display:grid;place-items:center;font-size:58px;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.price{font-size:20px;font-weight:900;margin:10px 0}.old{text-decoration:line-through;color:#777;margin-left:8px;font-size:14px}.btn{background:#d8b25b;color:#111;border:0;border-radius:8px;padding:11px 14px;font-weight:900;cursor:pointer;width:100%}.box{max-width:720px;background:#131315;border:1px solid #29292d;border-radius:14px;padding:20px}.box input,.box textarea{width:100%;background:#1c1c1f;color:white;border:1px solid #37373c;border-radius:8px;padding:11px;margin:6px 0 12px}.pay{display:block;border:1px solid #35353a;padding:13px;border-radius:9px;margin:8px 0}.pay input{width:auto;margin:0 8px 0 0}.phone{font-size:28px;color:#d8b25b}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}nav{display:none}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><header><span class="logo">MR</span><span class="brand">MR LuxeCart</span><nav><a href="#shop">Shop</a><a href="#checkout">Checkout</a><a href="#contact">Contact</a><a href="/admin.html">Admin</a></nav></header><section class="hero"><small class="gold">PREMIUM ONLINE SHOP</small><h1>Shop smarter.<br><span class="gold">Live better.</span></h1><p>Secure ordering with bKash, Nagad and Cash on Delivery.</p></section><section id="shop" class="section"><h2>Products</h2><div id="products" class="grid"></div></section><section id="checkout" class="section"><div class="box"><h2>Checkout</h2><p id="selected">Select a product above.</p><label>Name<input id="name" autocomplete="name"></label><label>Phone<input id="phone" inputmode="tel" autocomplete="tel"></label><label>Address<textarea id="address" rows="3" autocomplete="street-address"></textarea></label><h3>Payment method</h3><label class="pay"><input type="radio" name="pm" value="COD" checked> Cash on Delivery</label><label class="pay"><input type="radio" name="pm" value="bKash"> bKash</label><label class="pay"><input type="radio" name="pm" value="Nagad"> Nagad</label><div id="mobilePay" style="display:none"><p id="payHelp"></p><label>Payment phone<input id="paymentPhone" inputmode="tel"></label><label>Transaction ID<input id="transactionId"></label></div><button class="btn" id="placeBtn">Place Order</button></div></section><section id="contact" class="section"><h2>Contact</h2><a class="phone" href="tel:01321918689">01321918689</a></section><script>let products=[],cart=[],store;const $=id=>document.getElementById(id);async function load(){store=await fetch('/api/store').then(r=>r.json());products=store.products;$('products').innerHTML=products.map(p=>`<article class="card"><div class="pic">${p.image?`<img src="${p.image}" alt="${p.name}">`:(p.icon||'🛍️')}</div><h3>${p.name}</h3><small>${p.category} · ${p.stock} in stock</small><div class="price">৳${p.price.toLocaleString('en-BD')}${p.oldPrice?`<span class="old">৳${p.oldPrice.toLocaleString('en-BD')}</span>`:''}</div><button class="btn" onclick="choose('${p.id}')">Buy Now</button></article>`).join('')}function choose(id){const p=products.find(x=>x.id===id);cart=[{productId:id,qty:1}];$('selected').textContent=p.name+' — ৳'+p.price.toLocaleString('en-BD');location.hash='checkout'}document.querySelectorAll('input[name="pm"]').forEach(r=>r.addEventListener('change',()=>{const m=document.querySelector('input[name="pm"]:checked').value; $('mobilePay').style.display=m==='COD'?'none':'block';$('payHelp').textContent=m==='bKash'?'Send payment to '+(store.settings.bkashNumber||'the store merchant number')+' and enter the transaction ID.':'Send payment to '+(store.settings.nagadNumber||'the store merchant number')+' and enter the transaction ID.'}));$('placeBtn').onclick=async()=>{if(!cart.length)return alert('Select a product first.');const method=document.querySelector('input[name="pm"]:checked').value;const body={customer:{name:$('name').value.trim(),phone:$('phone').value.trim(),address:$('address').value.trim()},items:cart,paymentMethod:method,paymentPhone:$('paymentPhone').value.trim(),transactionId:$('transactionId').value.trim()};if(!body.customer.name||!body.customer.phone||!body.customer.address)return alert('Please fill name, phone and address.');if(method!=='COD'&&!body.transactionId)return alert('Enter the payment transaction ID.');$('placeBtn').disabled=true;try{const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),x=await r.json();if(!r.ok)throw new Error(x.error);alert('Order placed: '+x.id);cart=[];$('selected').textContent='Order placed successfully.';await load()}catch(e){alert(e.message)}finally{$('placeBtn').disabled=false}};load();</script></body></html>
