<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MR LuxeCart Admin</title><style>body{margin:0;background:#09090a;color:#f5f2ea;font-family:Arial,sans-serif}.wrap{max-width:1250px;margin:auto;padding:25px 4%}.head{display:flex;justify-content:space-between;align-items:center}.gold{background:#d8b25b;color:#111;border:0;padding:11px 15px;border-radius:8px;font-weight:800;cursor:pointer}.panel{background:#121214;border:1px solid #29292d;border-radius:13px;padding:20px;margin:18px 0}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:17px;background:#18181b;border:1px solid #29292d;border-radius:10px}.num{font-size:27px;font-weight:800;margin-top:6px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form input,.form select{width:100%;padding:10px;background:#1b1b1e;border:1px solid #39393e;color:white;border-radius:8px;margin-top:5px}.tabs{display:flex;gap:8px;overflow:auto;margin:22px 0}.tab{padding:10px 13px;background:#19191b;color:#bbb;border:1px solid #333;border-radius:8px}.active{color:#d8b25b;border-color:#d8b25b}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #29292d;font-size:13px}.scroll{overflow:auto}.danger{background:#401818;color:#ff9c9c;border:0;padding:7px;border-radius:7px}.preview{width:70px;height:50px;object-fit:cover;border-radius:6px}.edit{background:#24241f;color:#e8d18c;border:1px solid #5b4b22;padding:7px;border-radius:7px}@media(max-width:700px){.stats,.form{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="head"><h1><span style="color:#d8b25b">MR</span> Admin</h1><div><a href="/" style="color:#d8b25b;margin-right:15px">Store →</a><button id="logout" class="edit">Logout</button></div></div><div id="login" class="panel"><h2>Admin Login</h2><div class="form"><label>Username<input id="u"></label><label>Password<input id="p" type="password"></label></div><br><button id="loginBtn" class="gold">Login</button></div><div id="app" class="hidden"><div class="tabs"><button class="tab active" data-view="dash">Dashboard</button><button class="tab" data-view="products">Products</button><button class="tab" data-view="orders">Orders</button><button class="tab" data-view="customers">Customers</button><button class="tab" data-view="settings">Settings</button></div><section id="dash" class="view"><div id="stats" class="stats"></div></section><section id="products" class="view hidden"><div class="panel"><h2 id="formTitle">Add Product</h2><input type="hidden" id="pid"><div class="form"><label>Name<input id="pn"></label><label>Category<input id="pc"></label><label>Price<input id="pp" type="number"></label><label>Old Price<input id="po" type="number"></label><label>Stock<input id="ps" type="number"></label><label>Icon<input id="pi" placeholder="🛍️"></label></div><br><label>Product image <input id="img" type="file" accept="image/*"></label><br><br><button id="saveProduct" class="gold">Save Product</button> <button id="cancelEdit" class="edit hidden">Cancel Edit</button></div><div class="panel scroll"><table><thead><tr><th>Image</th><th>Product</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead><tbody id="pr"></tbody></table></div></section><section id="orders" class="view hidden"><div class="panel scroll"><table><thead><tr><th>ID</th><th>Customer</th><th>Total</th><th>Payment</th><th>Order</th><th>Payment status</th></tr></thead><tbody id="or"></tbody></table></div></section><section id="customers" class="view hidden"><div class="panel scroll"><table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Address</th><th>Orders</th></tr></thead><tbody id="cu"></tbody></table></div></section><section id="settings" class="view hidden"><div class="panel"><h2>Store & Payment Settings</h2><div class="form"><label>Shop name<input id="sn"></label><label>Contact phone<input id="sp"></label><label>bKash merchant number<input id="bn"></label><label>Nagad merchant number<input id="nn"></label></div><br><button id="saveSettings" class="gold">Save Settings</button></div></section></div></div><script>const $=id=>document.getElementById(id);let store,editing=false;async function api(url,opt={}){const r=await fetch(url,{credentials:'include',...opt});if(r.status===401){$('app').classList.add('hidden');$('login').classList.remove('hidden')}return r}async function login(){const r=await fetch('/api/admin/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('u').value,password:$('p').value})});const x=await r.json();if(!r.ok)return alert(x.error);start()}async function start(){const r=await api('/api/admin/me');if(!r.ok)return; $('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}async function load(){store=await api('/api/store').then(r=>r.json());const [o,c]=await Promise.all([api('/api/orders').then(r=>r.json()),api('/api/customers').then(r=>r.json())]);$('stats').innerHTML=[['Products',store.products.length],['Orders',o.length],['Customers',c.length],['Revenue','৳'+o.reduce((a,x)=>a+x.total,0).toLocaleString('en-BD')]].map(x=>`<div class="stat">${x[0]}<div class="num">${x[1]}</div></div>`).join('');$('pr').innerHTML=store.products.map(p=>`<tr><td>${p.image?`<img class="preview" src="${p.image}">`:(p.icon||'🛍️')}</td><td>${esc(p.name)}<br><small>${esc(p.category)}</small></td><td>৳${p.price.toLocaleString('en-BD')}</td><td>${p.stock}</td><td><button class="edit" onclick="editProduct('${p.id}')">Edit</button> <button class="danger" onclick="del('${p.id}')">Delete</button></td></tr>`).join('');$('or').innerHTML=o.map(x=>`<tr><td>${x.id}<br><small>${new Date(x.createdAt).toLocaleString()}</small></td><td>${esc(x.customerName)}<br>${esc(x.customerPhone)}</td><td>৳${x.total.toLocaleString('en-BD')}</td><td>${x.paymentMethod}<br>${esc(x.transactionId||'')}</td><td><select onchange="status('${x.id}',this.value)">${['Pending','Confirmed','Shipped','Delivered','Cancelled'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></td><td><select onchange="payStatus('${x.id}',this.value)">${['Pending','Awaiting verification','Paid','Failed','Refunded'].map(s=>`<option ${s===x.paymentStatus?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('');$('cu').innerHTML=c.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.email||'')}</td><td>${esc(x.address||'')}</td><td>${x.orders||0}</td></tr>`).join('');$('sn').value=store.settings.shop||'';$('sp').value=store.settings.phone||'';$('bn').value=store.settings.bkashNumber||'';$('nn').value=store.settings.nagadNumber||''}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function upload(){if(!$('img').files[0])return '';const fd=new FormData();fd.append('image',$('img').files[0]);const r=await api('/api/admin/upload',{method:'POST',body:fd});const x=await r.json();if(!r.ok)throw Error(x.error);return x.url}async function saveProduct(){try{let image=editing?store.products.find(p=>p.id===$('pid').value)?.image||'':'';if($('img').files[0])image=await upload();const body={name:$('pn').value,category:$('pc').value,price:$('pp').value,oldPrice:$('po').value,stock:$('ps').value,icon:$('pi').value,image};const url=editing?'/api/products/'+$('pid').value:'/api/products';const r=await api(url,{method:editing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const x=await r.json();if(!r.ok)throw Error(x.error);resetForm();await load()}catch(e){alert(e.message)}}function editProduct(id){const p=store.products.find(x=>x.id===id);editing=true;$('pid').value=p.id;$('pn').value=p.name;$('pc').value=p.category;$('pp').value=p.price;$('po').value=p.oldPrice;$('ps').value=p.stock;$('pi').value=p.icon||'';$('formTitle').textContent='Edit Product';$('cancelEdit').classList.remove('hidden');location.hash='products'}function resetForm(){editing=false;$('pid').value='';['pn','pc','pp','po','ps','pi'].forEach(x=>$(x).value='');$('img').value='';$('formTitle').textContent='Add Product';$('cancelEdit').classList.add('hidden')}async function del(id){if(confirm('Delete product?')){const r=await api('/api/products/'+id,{method:'DELETE'});if(!r.ok)alert((await r.json()).error);await load()}}async function status(id,s){await api('/api/orders/'+id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s})});await load()}async function payStatus(id,s){await api('/api/orders/'+id+'/payment-status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentStatus:s})});await load()}$('loginBtn').onclick=login;$('saveProduct').onclick=saveProduct;$('cancelEdit').onclick=resetForm;$('saveSettings').onclick=async()=>{await api('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({shop:$('sn').value,phone:$('sp').value,bkashNumber:$('bn').value,nagadNumber:$('nn').value})});alert('Saved');load()};$('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.reload()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));$(b.dataset.view).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');load()});start().catch(()=>{});</script></body></html>
